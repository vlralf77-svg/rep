<script>
function detectIE(){
	var isIE = false;
	var userAgent = window.navigator.userAgent;
	
	var oldIE = userAgent.indexOf('MSIE ');
	var newIE = userAgent.indexOf('Trident/');
	
	if((oldIE > -1 )|| (newIE > -1 )){
		isIE = true;
	}
	
	return isIE;
}
// ready
$(document).ready(function() {
	
		
	// 팝업 닫기
	var popupCloseBtn = document.getElementById('popupClose');
	
	popupCloseBtn.addEventListener('click', function() {
		popupClose();
	});
	
	popupCloseBtn.addEventListener('keydown',  function(event) {
		if(event.key === 'Enter'){
			popupClose();
		}
	});
	
	// 셀프테스트 이동(새탭)
	document.getElementById('selfTestBtn').addEventListener('click',  function() {
		popupClose();
		window.open('/main/mainPage/healthiness/selfTest.do', '_blank');
		return false;
	});
	
	// logout 버튼
	document.getElementById('logoutBtn').addEventListener('click', function() {
		popupClose();
		openLogoutPop();
	});
	
	var popupDialog = document.getElementById('asideletter');
	var closeBtn = document.getElementById('popupClose');
	
	popupDialog.addEventListener('keydown',  function(event) {
		if(event.key === 'Tab'){
			if(event.shiftKey){
				if(document.activeElement === popupDialog){
					closeBtn.focus();
					event.preventDefault();
				}				
			}else{
				if(document.activeElement === closeBtn){
					popupDialog.focus();
					event.preventDefault();
				}				
			}
		}
	});

}); // ready

// 건전 팝업(60분) 열기
function popupOpen(e){
	var popup = document.getElementById('asideletter');
	if(e != null ){
		//popup 닫힐때 60분 기준으로 초기화
		popupClose(); // popup 초기화
		document.getElementById('loginTime').innerHTML = '60분';
		document.getElementById('divLetter').className = 'time-letter1';
	}
	var isIE = detectIE();
	popup.style.display = 'block';
	if(!isIE){
		popup.show();	
	}	
	popup.focus();
}

// 건전팝업 닫기 
function popupClose() {
	var popup = document.getElementById('asideletter');
	var isIE = detectIE();
	if(!isIE){	
		popup.classList.add('hide');
		popup.addEventListener('animationend', function() {
			popup.close();
			popup.classList.remove('hide');
			popup.removeEventListener('animationend', arguments.callee, false);
			popup.style.display = 'none';
		}, false);
	}else{
		popup.style.display = 'none';
	}
}

// 건전 팝업(90분) 열기
function popup90Open(){
	document.getElementById('loginTime').innerHTML = '90분';
	document.getElementById('divLetter').className = 'time-letter2';
	document.getElementById('selfTestBtn').style.display = 'block';
	popupOpen();
}

// 로그아웃
function openLogoutPop() {
 	if(chkSlipState() == false) return;
 	var url = '/sub/subPage/mbrsvc/logoutPop.do';
 	var title = '로그아웃';
	BUICommon.openModalByUrl(url, title, 'small');
}
</script>
