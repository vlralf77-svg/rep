name: Scrape Live Scores

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 동시 실행 방지 (스코어 잡끼리)
concurrency:
  group: scrape-scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gracious-fermat-c195k9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install Google Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Install deps
        working-directory: scripts
        run: npm install

      - name: Run scores scraper
        working-directory: scripts
        run: node scrape-scores.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/livescores.json
          git diff --cached --quiet || git commit -m "chore: update live scores $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin claude/gracious-fermat-c195k9
          git push origin HEAD:claude/gracious-fermat-c195k9
