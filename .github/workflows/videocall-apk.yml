name: Build VideoCall APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'apps/videocall-android/**'
      - '.github/workflows/videocall-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: apps/videocall-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/videocall-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Prepare APK
        run: |
          SRC="apps/videocall-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC" || { echo "APK not found!"; exit 1; }
          cp "$SRC" wifi-videocall.apk
          echo "APK size: $(du -h wifi-videocall.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-videocall-apk
          path: wifi-videocall.apk
          retention-days: 30

      - name: Publish APK to a Release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: videocall-apk
          name: WiFi 영상통화 APK
          body: |
            같은 WiFi에 연결된 기기끼리 영상통화하는 Android 앱입니다.

            **사용법**
            1. PC에서 시그널링 서버 실행: `pnpm --filter @sports/videocall start`
            2. 이 APK를 안드로이드 폰에 설치 (알 수 없는 출처 허용 필요)
            3. 앱 실행 후 서버가 알려준 주소(예: `https://192.168.0.10:8443`) 입력 → 접속
            4. 이름·방 코드 입력 후 통화
          files: wifi-videocall.apk
          prerelease: true
          make_latest: false
