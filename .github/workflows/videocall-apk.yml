name: Build VideoCall APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'apps/videocall-android/**'
      - '.github/workflows/videocall-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: apps/videocall-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/videocall-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Prepare APK
        run: |
          SRC="apps/videocall-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC" || { echo "APK not found!"; exit 1; }
          cp "$SRC" wifi-videocall.apk
          echo "APK size: $(du -h wifi-videocall.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-videocall-apk
          path: wifi-videocall.apk
          retention-days: 30

      - name: Publish APK to a Release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: videocall-apk
          name: WiFi 영상통화 APK
          body: |
            OS 상관없이 영상통화하는 Android 앱입니다. **서버 운영 불필요** —
            앱을 열면 공개 클라우드(PeerJS) 기반 통화 페이지가 바로 로드됩니다.

            **사용법**
            1. 이 APK를 안드로이드 폰에 설치 (알 수 없는 출처 허용 필요)
            2. 앱 실행 → 카메라/마이크 권한 허용
            3. 이름과 (겹치지 않게 특이한) 방 코드 입력 → 입장
            4. 상대는 같은 방 코드로 이 앱 또는 브라우저(https://vlralf77-svg.github.io/rep/)로 접속

            > 상단 주소창에 자체 서버 주소를 넣으면 그 서버로도 접속할 수 있습니다.
          files: wifi-videocall.apk
          prerelease: true
          make_latest: false
