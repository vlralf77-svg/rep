name: Deploy soccer game to GitHub Pages

on:
  push:
    branches:
      - claude/serene-galileo-xnzqhp
    paths:
      - "soccer-game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload soccer-game folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: soccer-game
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
