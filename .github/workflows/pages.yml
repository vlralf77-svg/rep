name: Deploy soccer game to GitHub Pages

on:
  push:
    branches:
      - claude/serene-galileo-xnzqhp
    paths:
      - "soccer-game/**"
      - "soccer-game-3d/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (2D + 3D + landing)
        run: |
          mkdir -p _site
          cp -r soccer-game _site/soccer-game
          cp -r soccer-game-3d _site/soccer-game-3d
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>⚽ 프리킥 챌린지</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { min-height: 100vh; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 22px; padding: 24px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: linear-gradient(160deg, #0d2818, #15863a); color: #fff; }
              h1 { font-size: 30px; }
              p { color: #c8f0d6; margin-top: -10px; }
              .cards { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
              a.card { display: block; width: 230px; padding: 24px; border-radius: 18px;
                text-decoration: none; color: #0d2818; font-weight: 800; text-align: center;
                background: linear-gradient(180deg, #ffe14d, #ffc400);
                box-shadow: 0 10px 26px rgba(0,0,0,0.4); transition: transform .1s ease; }
              a.card:active { transform: scale(.97); }
              a.card .big { font-size: 40px; display: block; margin-bottom: 8px; }
              a.card small { display: block; margin-top: 8px; font-weight: 600; color: #14532b; }
            </style>
          </head>
          <body>
            <h1>⚽ 프리킥 챌린지</h1>
            <p>방향과 파워를 골라 골을 넣어보세요!</p>
            <div class="cards">
              <a class="card" href="soccer-game-3d/"><span class="big">🥅</span>3D 버전<small>입체 그래픽 · 추천</small></a>
              <a class="card" href="soccer-game/"><span class="big">🎮</span>2D 버전<small>가벼운 평면 버전</small></a>
            </div>
          </body>
          </html>
          HTML
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
