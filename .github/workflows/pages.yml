name: Deploy VideoCall Web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gracious-fermat-c195k9   # 저장소 기본 브랜치
    paths:
      - 'apps/videocall/pages/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개로 제한
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages 가 꺼져 있으면 자동으로 켠다 (enablement: true)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/videocall/pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
