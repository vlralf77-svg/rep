plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wifi.videocall'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wifi.videocall'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 프레임워크 API 만 사용 (androidx 등 외부 의존성 없음)
}
