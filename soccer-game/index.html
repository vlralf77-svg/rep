<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1b8a3a" />
<title>⚽ 프리킥 챌린지</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-item">
        <span class="hud-label">점수</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">남은 킥</span>
        <span id="shots" class="hud-value">5</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">최고</span>
        <span id="best" class="hud-value">0</span>
      </div>
    </header>

    <canvas id="field" width="400" height="600"></canvas>

    <div id="message" class="message hidden"></div>

    <footer id="controls">
      <p id="hint" class="hint">화면을 눌러 방향을 조준하세요</p>
      <button id="actionBtn" class="action-btn">조준 시작</button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
